server:
  port: 8081

spring:
  application:
    name: titan-dispatch

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:titan_dispatch}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 25
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false # Change to true in dev profile
        dialect: org.hibernate.dialect.PostgreSQLDialect
        integration:
          envers:
            audit_table_suffix: _aud
            store_data_at_delete: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      lettuce:
        pool:
          max-active: 20
          max-idle: 10

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus
  endpoint:
    health:
      show-details: always

jwt:
  # Change in production via environment variable
  secret: ${JWT_SECRET:8a4b6c9d2e1f5g8h4j7k9l2m4n6p8q1r3s5t7v9w2x4y6z8A2B4C6D8E1F3G5H7J9}
  access-expiration-ms: 900000     # 15 minutes
  refresh-expiration-ms: 604800000 # 7 days