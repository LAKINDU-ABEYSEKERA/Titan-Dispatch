spring:
  config:
    import: "optional:aws-secretsmanager:titan-dispatch/prod"

  datasource:
    # Notice we no longer use ${DB_PASS}, it is injected directly from AWS
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:titan_dispatch}
    username: ${db_username}
    password: ${db_password}

jwt:
  secret: ${jwt_secret}

server:
  # CRITICAL: Tells Spring Boot it is behind a proxy (Nginx/ALB) and to trust X-Forwarded headers
  forward-headers-strategy: framework