<aside 
  [class.w-64]="!isCollapsed()" 
  [class.w-20]="isCollapsed()" 
  class="h-full bg-slate-900 border-r border-slate-800 text-slate-400 flex flex-col justify-between transition-all duration-300 ease-in-out">
  
  <div>
    <div class="h-16 flex items-center justify-between px-4 border-b border-slate-800">
      @if (!isCollapsed()) {
        <span class="text-sm font-black tracking-widest text-white uppercase animate-fade-in">Titan Core</span>
      } @else {
        <span class="text-sm font-black text-blue-500 mx-auto animate-fade-in">T</span>
      }
      <button 
        (click)="toggleCollapse()" 
        class="p-1.5 rounded bg-slate-800 text-slate-400 hover:text-white hover:bg-slate-700 transition-colors cursor-pointer">
        {{ isCollapsed() ? '→' : '←' }}
      </button>
    </div>

    <nav class="p-3 space-y-1">
      <nav class="p-3 space-y-2">
  <a 
    routerLink="/dashboard" 
    routerLinkActive="bg-slate-800 text-white font-semibold border-l-2 border-blue-500"
    class="flex items-center space-x-3 px-3 py-2.5 rounded-lg hover:bg-slate-800/50 hover:text-slate-200 transition-all group">
    <span class="text-lg group-hover:scale-110 transition-transform">📊</span>
    @if (!isCollapsed()) { <span class="text-xs font-bold uppercase tracking-wider animate-fade-in">Console Overview</span> }
  </a>
  <a 
    routerLink="/equipment" 
    routerLinkActive="bg-slate-800 text-white font-semibold border-l-2 border-blue-500"
    class="flex items-center space-x-3 px-3 py-2.5 rounded-lg hover:bg-slate-800/50 hover:text-slate-200 transition-all group">
    <span class="text-lg group-hover:scale-110 transition-transform">🚜</span>
    @if (!isCollapsed()) { <span class="text-xs font-bold uppercase tracking-wider animate-fade-in">Fleet Inventory</span> }
  </a>
</nav>
    </nav>
  </div>

  <div class="p-4 border-t border-slate-800 bg-slate-950/40 text-center">
    @if (!isCollapsed()) {
      <p class="text-[10px] uppercase tracking-widest font-mono text-amber-500 font-bold">Node: Local // 8081</p>
    } @else {
      <span class="text-amber-500">⚡</span>
    }
  </div>
</aside>
