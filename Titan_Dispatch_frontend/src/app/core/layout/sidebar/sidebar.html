<aside 
  [class.w-64]="!isCollapsed()" 
  [class.w-20]="isCollapsed()" 
  class="h-full bg-slate-900 border-r border-slate-800 text-slate-400 flex flex-col justify-between transition-all duration-300 ease-in-out">
  
  <div>
    <!-- Header: Dynamic justification -->
    <div class="h-16 flex items-center border-b border-slate-800 transition-all duration-300"
         [class.justify-between]="!isCollapsed()"
         [class.justify-center]="isCollapsed()"
         [class.px-4]="!isCollapsed()">
      
      @if (!isCollapsed()) {
        <span class="text-sm font-black tracking-widest text-white uppercase animate-fade-in whitespace-nowrap">Titan Core</span>
      } 

      <button 
        (click)="toggleCollapse()" 
        class="p-1.5 rounded bg-slate-800 text-slate-400 hover:text-white hover:bg-slate-700 transition-colors cursor-pointer"
        [title]="isCollapsed() ? 'Expand Menu' : 'Collapse Menu'">
        <span class="flex justify-center items-center h-5 w-5">{{ isCollapsed() ? '→' : '←' }}</span>
      </button>
    </div>

    <!-- Navigation -->
    <nav class="p-3 space-y-2">
      <a 
        routerLink="/dashboard" 
        routerLinkActive="bg-slate-800 text-white font-semibold border-l-2 border-blue-500"
        class="flex items-center py-2.5 rounded-lg hover:bg-slate-800/50 hover:text-slate-200 transition-all group overflow-hidden"
        [class.px-3]="!isCollapsed()"
        [class.justify-center]="isCollapsed()"
        [class.space-x-3]="!isCollapsed()"
        title="Console Overview">
        <span class="text-lg group-hover:scale-110 transition-transform flex-shrink-0">📊</span>
        @if (!isCollapsed()) { 
          <span class="text-xs font-bold uppercase tracking-wider animate-fade-in whitespace-nowrap">Console Overview</span> 
        }
      </a>
      
      <a 
        routerLink="/equipment" 
        routerLinkActive="bg-slate-800 text-white font-semibold border-l-2 border-blue-500"
        class="flex items-center py-2.5 rounded-lg hover:bg-slate-800/50 hover:text-slate-200 transition-all group overflow-hidden"
        [class.px-3]="!isCollapsed()"
        [class.justify-center]="isCollapsed()"
        [class.space-x-3]="!isCollapsed()"
        title="Fleet Inventory">
        <span class="text-lg group-hover:scale-110 transition-transform flex-shrink-0">🚜</span>
        @if (!isCollapsed()) { 
          <span class="text-xs font-bold uppercase tracking-wider animate-fade-in whitespace-nowrap">Fleet Inventory</span> 
        }
      </a>

      <!-- NEW: Operator Roster Button -->
      <a 
        routerLink="/operators" 
        routerLinkActive="bg-slate-800 text-white font-semibold border-l-2 border-blue-500"
        class="flex items-center py-2.5 rounded-lg hover:bg-slate-800/50 hover:text-slate-200 transition-all group overflow-hidden"
        [class.px-3]="!isCollapsed()"
        [class.justify-center]="isCollapsed()"
        [class.space-x-3]="!isCollapsed()"
        title="Operator Roster">
        <span class="text-lg group-hover:scale-110 transition-transform flex-shrink-0">👷</span>
        @if (!isCollapsed()) { 
          <span class="text-xs font-bold uppercase tracking-wider animate-fade-in whitespace-nowrap">Operator Roster</span> 
        }
      </a>

      <a 
        routerLink="/maintenance" 
        routerLinkActive="bg-slate-800 text-white font-semibold border-l-2 border-blue-500"
        class="flex items-center py-2.5 rounded-lg hover:bg-slate-800/50 hover:text-slate-200 transition-all group overflow-hidden"
        [class.px-3]="!isCollapsed()"
        [class.justify-center]="isCollapsed()"
        [class.space-x-3]="!isCollapsed()"
        title="Fleet Maintenance">
        <span class="text-lg group-hover:scale-110 transition-transform flex-shrink-0">🛠️</span>
        @if (!isCollapsed()) { 
          <span class="text-xs font-bold uppercase tracking-wider animate-fade-in whitespace-nowrap">Fleet Maintenance</span> 
        }
      </a>
    </nav>
  </div>

  <!-- Footer -->
  <div class="p-4 border-t border-slate-800 bg-slate-950/40 flex justify-center items-center overflow-hidden">
    @if (!isCollapsed()) {
      <p class="text-[10px] uppercase tracking-widest font-mono text-amber-500 font-bold whitespace-nowrap animate-fade-in">Node: Local // 8081</p>
    } @else {
      <span class="text-amber-500 animate-fade-in cursor-help" title="Node: Local // 8081">⚡</span>
    }
  </div>
</aside>
