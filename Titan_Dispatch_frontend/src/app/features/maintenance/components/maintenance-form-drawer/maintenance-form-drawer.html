@if (isOpen()) {
  <!-- Backdrop -->
  <div class="fixed inset-0 z-[60] bg-slate-950/80 backdrop-blur-sm transition-opacity" (click)="close()"></div>
  
  <!-- Drawer Panel -->
  <div class="fixed top-0 right-0 h-full w-full max-w-md bg-slate-900 border-l border-slate-800 shadow-2xl z-[70] p-6 flex flex-col transform transition-transform duration-300 overflow-y-auto">
    
    <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-800">
      <div>
        <h2 class="text-white font-black uppercase tracking-wider">Log Service Complete</h2>
        <p class="text-[10px] font-mono text-blue-400 mt-1">Unlock Asset for Dispatch</p>
      </div>
      <button (click)="close()" class="text-slate-500 hover:text-white transition-colors cursor-pointer text-xl">✕</button>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex-1 flex flex-col space-y-5">
      
      <div>
        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Locked Asset</label>
        <select 
          formControlName="equipmentId" 
          class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-white focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition-all cursor-pointer font-mono">
          <option value="" disabled selected>Select locked asset...</option>
          @for (item of equipment(); track item.id) {
            <option [value]="item.id">{{ item.assetTag }}</option>
          }
        </select>
        @if (equipment().length === 0) {
          <p class="text-[10px] text-amber-500 mt-1.5 font-mono">⚠️ No assets are currently locked in the shop.</p>
        }
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Completion Date</label>
        <input 
          type="datetime-local" 
          formControlName="serviceDate" 
          class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-white focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition-all cursor-pointer font-mono">
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Service Type</label>
          <select 
            formControlName="serviceType" 
            class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-white focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition-all cursor-pointer font-mono text-sm">
            <option value="" disabled selected>Select...</option>
            <option value="PREVENTATIVE">Preventative</option>
            <option value="REPAIR">Repair</option>
            <option value="INSPECTION">Inspection</option>
            <option value="EMERGENCY">Emergency</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Engine Hrs</label>
          <input 
            type="number" 
            step="0.1" 
            formControlName="hoursAtService" 
            class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-white focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition-all font-mono">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Total Cost ($)</label>
        <input 
          type="number" 
          step="0.01" 
          formControlName="totalCost" 
          class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-white focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition-all font-mono">
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Mechanic Notes</label>
        <textarea 
          formControlName="notes" 
          rows="3" 
          class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-white focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition-all font-mono text-sm resize-none" 
          placeholder="Enter service details..."></textarea>
      </div>

      @if (errorMessage()) {
        <div class="p-3 rounded-lg bg-red-900/50 border border-red-500/50 text-red-200 text-xs flex items-start gap-2">
          <span class="text-red-400">🚨</span> {{ errorMessage() }}
        </div>
      }

      <div class="mt-auto pt-6 border-t border-slate-800">
        <button 
          type="submit" 
          [disabled]="form.invalid || isLoading() || equipment().length === 0"
          class="w-full py-3.5 bg-blue-600 hover:bg-blue-500 text-white font-black uppercase tracking-widest rounded-lg transition-colors shadow-[0_0_15px_rgba(37,99,235,0.3)] disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer">
          {{ isLoading() ? 'Processing...' : 'Submit Log & Unlock' }}
        </button>
      </div>
    </form>
  </div>
}
