@if (isOpen()) {
  <div class="fixed inset-0 z-40 bg-black/60 backdrop-blur-sm transition-opacity" (click)="close()"></div>
}

<div class="fixed top-0 end-0 transition-all duration-300 transform h-full max-w-md w-full z-50 titan-panel titan-border border-l shadow-2xl flex flex-col"
     [class.translate-x-full]="!isOpen()" [class.translate-x-0]="isOpen()">
  
  <div class="flex justify-between items-center py-4 px-6 titan-border border-b bg-black/20">
    <h3 class="font-bold text-lg text-white tracking-widest uppercase">
      {{ activeOperatorId() ? 'Update' : 'Register' }} Operator
    </h3>
    <button type="button" (click)="close()" class="text-slate-400 hover:text-white transition-colors cursor-pointer">✕</button>
  </div>
  
  <form [formGroup]="form" (ngSubmit)="submit()" class="flex-1 flex flex-col overflow-hidden">
    <div class="p-6 flex-1 overflow-y-auto space-y-6">
      
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-2 uppercase tracking-wider text-[10px]">First Name</label>
          <input type="text" formControlName="firstName" placeholder="John"
                 class="block w-full rounded-md bg-black/40 border border-slate-700 text-white px-4 py-3 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none font-mono text-sm">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-2 uppercase tracking-wider text-[10px]">Last Name</label>
          <input type="text" formControlName="lastName" placeholder="Doe"
                 class="block w-full rounded-md bg-black/40 border border-slate-700 text-white px-4 py-3 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none font-mono text-sm">
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-300 mb-2 uppercase tracking-wider text-[10px]">License Expiration Date</label>
        <input type="date" formControlName="licenseExpiration"
               class="block w-full rounded-md bg-black/40 border border-slate-700 text-white px-4 py-3 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none font-mono text-sm">
      </div>

      <!-- ADDED: Hourly Wage Field -->
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-2 uppercase tracking-wider text-[10px]">Hourly Wage ($)</label>
        <input type="number" step="0.01" formControlName="hourlyRate"
               class="block w-full rounded-md bg-black/40 border border-slate-700 text-white px-4 py-3 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none font-mono text-sm">
      </div>

      @if (errorMessage()) {
        <div class="bg-red-900/30 border border-red-500/50 text-red-400 p-3 rounded text-sm font-mono mt-4">
          {{ errorMessage() }}
        </div>
      }
    </div>

    <div class="p-6 titan-border border-t bg-black/20 flex justify-end gap-x-3">
      <button type="button" (click)="close()" class="titan-btn-secondary px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded text-sm font-bold cursor-pointer">Cancel</button>
      <button type="submit" [disabled]="form.invalid || isLoading()" class="titan-btn-primary px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded text-sm font-bold disabled:opacity-50 cursor-pointer">
        {{ isLoading() ? 'Saving...' : (activeOperatorId() ? 'Update Profile' : 'Register Operator') }}
      </button>
    </div>
  </form>
</div>
