@if (isOpen) {
  <div 
    class="fixed inset-0 z-[70] bg-slate-950/80 backdrop-blur-sm transition-opacity"
    (click)="closeDrawer()">
  </div>
}

<div 
  class="fixed top-0 end-0 z-[80] h-full w-full max-w-md transform transition-all duration-300 ease-in-out border-l border-slate-800 bg-slate-950 shadow-2xl flex flex-col"
  [class.translate-x-full]="!isOpen"
  [class.translate-x-0]="isOpen"
  tabindex="-1">
  
  <div class="flex justify-between items-center py-4 px-6 border-b border-slate-800 bg-slate-900/50">
    <div>
      <h3 class="font-black text-white uppercase tracking-wider">
        @if (form.controls.projectCode.disabled) { Configure Job Site } @else { Establish Job Site }
      </h3>
      <p class="text-[10px] font-mono text-slate-400 mt-0.5">Titan System Command Console</p>
    </div>
    <button (click)="closeDrawer()" class="text-slate-500 hover:text-white transition-colors cursor-pointer">
      ✕
    </button>
  </div>

  <div class="p-6 overflow-y-auto flex-1">
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5">
      
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1.5">Project Code</label>
        <input type="text" formControlName="projectCode" 
          class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-white text-sm focus:ring-2 focus:ring-blue-500 outline-none disabled:opacity-50 disabled:cursor-not-allowed font-mono uppercase" 
          placeholder="e.g., SITE-ALPHA-01" />
      </div>

      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1.5">Site Name / Description</label>
        <input type="text" formControlName="siteName" 
          class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-white text-sm focus:ring-2 focus:ring-blue-500 outline-none" 
          placeholder="e.g., Downtown Excavation Phase 2" />
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1.5">Latitude</label>
          <input type="number" step="0.000001" formControlName="latitude" 
            class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-white text-sm focus:ring-2 focus:ring-blue-500 outline-none font-mono" />
        </div>
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1.5">Longitude</label>
          <input type="number" step="0.000001" formControlName="longitude" 
            class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-white text-sm focus:ring-2 focus:ring-blue-500 outline-none font-mono" />
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1.5">Geofence Radius (Meters)</label>
        <input type="number" formControlName="geofenceRadiusMeters" 
          class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-white text-sm focus:ring-2 focus:ring-blue-500 outline-none font-mono" />
      </div>

      <div class="pt-6 border-t border-slate-800 flex justify-end gap-3">
        <button type="button" (click)="closeDrawer()" class="titan-btn-secondary px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded text-sm font-bold transition-colors cursor-pointer">Cancel</button>
        <button type="submit" [disabled]="isSubmitting()" class="titan-btn-primary px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded text-sm font-bold disabled:opacity-50 transition-colors cursor-pointer">
          @if (isSubmitting()) { Syncing... } @else { Save Configuration }
        </button>
      </div>
    </form>
  </div>

  @if (toastMessage()) {
    <div class="absolute bottom-4 left-4 right-4 bg-red-900/90 border border-red-500 text-white p-3 rounded shadow-lg flex items-start gap-2 backdrop-blur-sm z-50">
      <span class="text-red-400 font-bold">🚨</span>
      <div class="flex-1">
        <p class="text-xs font-bold uppercase text-red-200">System Rejected</p>
        <p class="text-xs mt-0.5">{{ toastMessage()?.detail }}</p>
      </div>
      <button (click)="dismissToast()" class="text-red-300 hover:text-white transition-colors cursor-pointer">✕</button>
    </div>
  }
</div>
