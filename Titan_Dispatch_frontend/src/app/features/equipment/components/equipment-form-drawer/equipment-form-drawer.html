@if (isOpen()) {
  <div class="fixed inset-0 z-40 bg-black/60 backdrop-blur-sm transition-opacity" (click)="close()"></div>
}

<div class="fixed top-0 end-0 transition-all duration-300 transform h-full max-w-md w-full z-50 titan-panel titan-border border-l shadow-2xl flex flex-col"
     [class.translate-x-full]="!isOpen()" [class.translate-x-0]="isOpen()">
  
  <div class="flex justify-between items-center py-4 px-6 titan-border border-b bg-black/20">
    <h3 class="font-bold text-lg text-white tracking-widest uppercase">
      {{ activeId() ? 'Edit Asset' : 'Register Asset' }}
    </h3>
    <button type="button" (click)="close()" class="text-gray-400 hover:text-white transition-colors">✕</button>
  </div>
  
  <form [formGroup]="form" (ngSubmit)="submit()" class="flex-1 flex flex-col overflow-hidden">
    <div class="p-6 flex-1 overflow-y-auto space-y-6">
      
      <div>
        <label class="block text-sm font-medium text-gray-300 mb-2 uppercase tracking-wider text-[10px]">Asset Tag</label>
        <input type="text" formControlName="assetTag" placeholder="e.g., EXCAVATOR-400"
               class="block w-full rounded-md bg-black/40 border border-gray-700 text-white px-4 py-3 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none font-mono">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-300 mb-2 uppercase tracking-wider text-[10px]">Internal Hourly Rate ($)</label>
        <input type="number" formControlName="internalHourlyRate" step="0.01"
               class="block w-full rounded-md bg-black/40 border border-gray-700 text-white px-4 py-3 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none font-mono">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-300 mb-2 uppercase tracking-wider text-[10px]">Insurance Expiration</label>
        <input type="date" formControlName="insuranceExpiration"
               class="block w-full rounded-md bg-black/40 border border-gray-700 text-white px-4 py-3 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none font-mono">
      </div>

      @if (errorMessage()) {
        <div class="bg-red-900/30 border border-red-500/50 text-red-400 p-3 rounded text-sm font-mono">
          {{ errorMessage() }}
        </div>
      }
    </div>

    <div class="p-6 titan-border border-t bg-black/20 flex justify-end gap-x-3">
      <button type="button" (click)="close()" class="titan-btn-secondary px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded text-sm font-bold">Cancel</button>
      <button type="submit" [disabled]="form.invalid || isLoading()" class="titan-btn-primary px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded text-sm font-bold disabled:opacity-50">
        {{ isLoading() ? 'Saving...' : 'Save Asset' }}
      </button>
    </div>
  </form>
</div>
